name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Pinned to the exact version in .swiftlint-version (the single source of truth) instead of
      # an unversioned `brew install swiftlint`, which drifts to whatever release is current and
      # silently changes rules and line-length counting. Prepend to PATH so this binary wins over
      # any SwiftLint pre-installed on the runner image.
      - name: Install SwiftLint (pinned)
        run: |
          set -euo pipefail
          EXPECTED="$(cat .swiftlint-version)"
          curl -fsSL -o /tmp/swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${EXPECTED}/portable_swiftlint.zip"
          mkdir -p "$HOME/swiftlint-pinned"
          unzip -o /tmp/swiftlint.zip swiftlint -d "$HOME/swiftlint-pinned"
          chmod +x "$HOME/swiftlint-pinned/swiftlint"
          echo "$HOME/swiftlint-pinned" >> "$GITHUB_PATH"
      - name: Verify SwiftLint version
        run: |
          set -euo pipefail
          EXPECTED="$(cat .swiftlint-version)"
          ACTUAL="$(swiftlint version)"
          echo "SwiftLint expected=${EXPECTED} actual=${ACTUAL}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::SwiftLint version mismatch: expected ${EXPECTED}, got ${ACTUAL}"
            exit 1
          fi
      - name: Lint
        run: swiftlint lint --config .swiftlint.yml --strict

  build-ios:
    name: Build iOS
    runs-on: macos-15
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('project.yml') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Generate project
        run: make generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project Vibrdrome.xcodeproj \
            -scheme Vibrdrome \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

  build-macos:
    name: Build macOS
    runs-on: macos-15
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('project.yml') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Generate project
        run: make generate

      - name: Build for macOS
        run: |
          xcodebuild build \
            -project Vibrdrome.xcodeproj \
            -scheme VibrdromeMac \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

  test:
    name: Test
    runs-on: macos-15
    needs: [build-ios]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('project.yml') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Generate project
        run: make generate

      - name: Run tests
        run: |
          xcodebuild test \
            -project Vibrdrome.xcodeproj \
            -scheme Vibrdrome \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults.xcresult || true
        # NOTE: test job uses || true until test target is added (Sprint 3)
